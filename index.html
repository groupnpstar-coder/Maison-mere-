<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maison Mère</title>
<meta name="description" content="Ton argent ne bouge pas sans ton accord. Construis au pays en toute confiance.">
<meta name="theme-color" content="#121211">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maison Mère">
<link rel="manifest" href="manifest.json">

<style>
/* Layout: one mobile column, max 480px, black and white like a document; money states carry the only color. */
:root{
  --bg:#FFFFFF; --fg:#121211; --muted:#5A5955; --line:#E3E2DE; --tile:#F0EFEB;
  --ink:#121211; --on-ink:#FFFFFF;
  --ok:#1D6B45; --warn:#9A5B05; --bad:#A3271C; --held:#3F4E8C;
  --display:Georgia, 'Times New Roman', serif;
  --body:system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111110; --fg:#F3F2EE; --muted:#A8A6A0; --line:#2C2B29; --tile:#1D1C1A;
  --ink:#F3F2EE; --on-ink:#111110;
  --ok:#5FC08E; --warn:#E3A94A; --bad:#EE7D70; --held:#9DAAE8; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111110; --fg:#F3F2EE; --muted:#A8A6A0; --line:#2C2B29; --tile:#1D1C1A;
  --ink:#F3F2EE; --on-ink:#111110;
  --ok:#5FC08E; --warn:#E3A94A; --bad:#EE7D70; --held:#9DAAE8; color-scheme:dark }
/* Une seule couleur de marque : le jaune chantier, avec le noir */
#modeTag{background:#FFD400;color:#111;font-weight:600;padding:0 8px;letter-spacing:.1em;border:none;min-height:32px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
#modeTag::after{content:"";width:6px;height:6px;border-right:1.5px solid #111;border-bottom:1.5px solid #111;transform:rotate(45deg) translateY(-2px)}
.top{position:sticky}
#spaceMenu{position:absolute;left:0;top:100%;margin-top:6px;z-index:20;background:var(--bg);border:1px solid var(--fg);min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#spaceMenu button{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);background:var(--bg);padding:14px 16px;min-height:52px}
#spaceMenu button:last-child{border-bottom:none}
#spaceMenu .on{background:#FFD400;color:#111;font-size:10px;letter-spacing:.1em;font-weight:600;padding:3px 6px}
.top{box-shadow:inset 0 3px 0 #FFD400}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-weight:400;font-size:15px;line-height:1.5}
*{box-sizing:border-box}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--fg)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:34px} h2{font-size:26px}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{font-family:var(--display);font-size:20px;background:none;border:none;padding:6px 0}
.seg{display:flex;border:1px solid var(--fg)}
.seg button{border:none;background:var(--bg);padding:8px 12px;font-size:11px;letter-spacing:.1em;font-weight:500;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.test{font-size:11px;letter-spacing:.04em;color:var(--warn);margin:8px 0 0;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--bg);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:12px;line-height:1.3;min-height:96px;justify-content:center}
.tile svg{width:24px;height:24px}
main{flex:1;padding-block:22px}
.btn{min-height:50px;border:none;background:var(--ink);color:var(--on-ink);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:0 18px;width:100%}
.btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--fg)}
.btn.sm{min-height:40px;width:auto;font-size:11px;padding:0 14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;padding:8px 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;text-decoration:underline;text-underline-offset:4px;text-align:left}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{border:none;border-bottom:1px solid var(--fg);background:transparent;padding:10px 0;min-height:44px;border-radius:0;width:100%}
.field textarea{border:1px solid var(--line);padding:10px;resize:vertical}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .t{font-weight:500}
.item>div{min-width:0}
.pill{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 7px;border:1px solid currentColor;white-space:nowrap}
.s-attente{color:var(--muted)} .s-bloque{color:var(--held)} .s-fait{color:var(--warn)} .s-paye{color:var(--ok)} .s-litige{color:var(--bad)} .s-rembourse{color:var(--muted)}
.verified{color:var(--ok)} .unverified{color:var(--muted)}
.tabs{display:flex;gap:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:none;background:none;padding:12px 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{border-bottom-color:var(--fg);font-weight:600}
.step{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.step.current{border-color:var(--fg)}
.money{font-variant-numeric:tabular-nums;font-weight:500}
.big{font-family:var(--display);font-size:38px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:8px;background:var(--tile)}
.bar span{display:block;height:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photo{display:flex;flex-direction:column;gap:4px}
.photo img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--tile);display:block;max-width:100%}
.photo span{font-size:10px;color:var(--muted);line-height:1.3}
.bubble{max-width:80%;padding:10px 13px;font-size:14px;background:var(--tile);overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--ink);color:var(--on-ink)}
.meta{font-size:10px;color:var(--muted)}
.empty{border:1px dashed var(--line);padding:22px;text-align:center;color:var(--muted);font-size:14px}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border:1px solid var(--fg);background:var(--bg);font-weight:600}
.stars button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.notice{border-left:2px solid var(--fg);padding:4px 0 4px 12px;font-size:13px;color:var(--muted)}
footer{font-size:11px;color:var(--muted);text-align:center;padding-top:20px;border-top:1px solid var(--line)}
.err{color:var(--bad);font-size:13px}
.intro{display:flex;gap:12px;align-items:flex-start;background:var(--tile);padding:14px 12px 14px 14px}
.intro .ic{width:36px;height:36px;border-radius:18px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.intro p{margin:0;font-size:14px;line-height:1.5;flex:1;min-width:0}
.intro p b{font-weight:600}
.intro button{width:36px;height:36px;border:none;background:none;color:var(--muted);font-size:20px;line-height:1;flex-shrink:0;margin:-6px -4px 0 0}
.house{display:flex;gap:16px;align-items:center;border:1px solid var(--line);padding:14px}
.house svg{width:120px;height:96px;flex-shrink:0}
.house .msg{font-family:var(--display);font-size:20px;line-height:1.2}
.check{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border:none;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.check .box{width:22px;height:22px;border:1px solid var(--fg);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.check[aria-pressed="true"] .box{background:var(--ink);color:var(--on-ink)}
.check[aria-pressed="true"] .txt{color:var(--muted);text-decoration:line-through}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--tile)}
.progress span{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex-shrink:0;min-height:38px;padding:0 14px;border:1px solid var(--fg);background:var(--bg);font-size:12px;letter-spacing:.06em}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;background:var(--tile);display:inline-flex;align-items:center;justify-content:center;font-weight:600;color:var(--fg);overflow:hidden}
.who{display:flex;gap:12px;align-items:center;min-width:0}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 7px;background:var(--tile);color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-size:11px}
.days div{display:flex;flex-direction:column;gap:3px;align-items:center}
.dot{width:14px;height:14px;border:1px solid var(--fg)}
.dot.on{background:var(--ok);border-color:var(--ok)}
.lang{border:1px solid var(--line);background:var(--bg);min-height:36px;padding:0 6px;font-size:12px}
@media (prefers-reduced-motion:no-preference){.btn,.item{transition:opacity .15s}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="row" style="gap:10px;min-width:0;position:relative"><button class="brand" data-a="home">Maison Mère</button><button id="modeTag" class="label" data-a="spacemenu" aria-haspopup="true" aria-expanded="false" hidden></button></div>
    <div id="spaceMenu" role="menu" hidden></div>
    <div class="row" style="gap:8px">
    <label for="langSel" class="label" style="position:absolute;left:-9999px">Langue</label>
    <select id="langSel" class="lang"><option value="fr">FR</option><option value="en">EN</option><option value="pt">PT</option><option value="ln">LN</option></select>
    <button id="acctBtn" data-a="go" data-v="account" aria-label="Mon compte" hidden style="width:44px;height:44px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"></path></svg></button>
    </div>
  </div>
  <p class="test" id="testBanner">Version de test : l'argent est fictif, rien n'est réellement payé.</p>
  <main id="main">
    <div class="stack">
      <h1>Ton argent ne bouge pas sans ton accord.</h1>
      <p class="muted">Ouverture de l'application…</p>
    </div>
  </main>
  <footer id="footRule">Chacun peut noter l'autre et arrêter le contrat si l'accord n'est pas respecté.</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
(function(){
const PAYS=['RD Congo','Angola','Congo-Brazzaville','Cameroun','Côte d\'Ivoire','Sénégal','Belgique','France','Chine','Russie','Brésil','Autre'];
const METIERS=['Maçonnerie','Ingénieur civil','Électricité','Plomberie','Menuiserie','Carrelage','Peinture','Toiture','Fournisseur de matériaux','Gardiennage','Installation de caméras','Géomètre','Photographe de chantier'];
const STATUS_FR={attente:'À bloquer',bloque:'Argent bloqué',fait:'À valider',paye:'Payé',litige:'Litige',rembourse:'Remboursé',livre:'Livré'};
const CATS=['Ciment','Blocs et briques','Fer à béton','Tôles','Sable et gravier','Bois','Plomberie','Électricité','Autre'];
const I18N={
 en:{'Version de test : l\'argent est fictif, rien n\'est réellement payé.':'Test version: the money is fictional, nothing is really paid.','Chacun peut noter l\'autre et arrêter le contrat si l\'accord n\'est pas respecté.':'Each side can rate the other and end the contract if the agreement is not respected.',
  'À bloquer':'To hold','Argent bloqué':'Money held','À valider':'To approve','Payé':'Paid','Litige':'Dispute','Remboursé':'Refunded','Livré':'Delivered',

  'Marché des matériaux':'Materials market','Estimer le prix d\'une maison':'Estimate a house price','Mes commandes':'My orders','Plan de test':'Test plan','Espace admin':'Admin space',
  'Vérifié':'Verified','Non vérifié':'Not verified','Bien noté':'Top rated','Fiable':'Reliable','Nouveau':'New','Commander':'Order','Valider et payer':'Approve and pay','Signaler un problème':'Report a problem','Étape terminée':'Stage complete','Avis':'Reviews','Laisser un avis':'Leave a review','Profil du client':'Client profile'},
 pt:{'Version de test : l\'argent est fictif, rien n\'est réellement payé.':'Versão de teste: o dinheiro é fictício, nada é pago de verdade.','Chacun peut noter l\'autre et arrêter le contrat si l\'accord n\'est pas respecté.':'Cada um pode avaliar o outro e terminar o contrato se o acordo não for respeitado.',
  'À bloquer':'A bloquear','Argent bloqué':'Dinheiro bloqueado','À valider':'A validar','Payé':'Pago','Litige':'Litígio','Remboursé':'Reembolsado','Livré':'Entregue',
  'Mes projets':'Os meus projetos','Nouveau projet':'Novo projeto','Trouver un professionnel':'Encontrar um profissional','Mon compte':'A minha conta','Retour':'Voltar','Professionnels':'Profissionais',
  'Étapes':'Etapas','Photos':'Fotos','Messages':'Mensagens','Paiement':'Pagamento','Gardien':'Guarda','Espace pro':'Espaço profissional','Mes chantiers':'As minhas obras',
  'Marché des matériaux':'Mercado de materiais','Estimer le prix d\'une maison':'Estimar o preço de uma casa','Mes commandes':'As minhas encomendas','Plan de test':'Plano de teste','Espace admin':'Espaço admin',
  'Vérifié':'Verificado','Non vérifié':'Não verificado','Bien noté':'Bem avaliado','Fiable':'Confiável','Nouveau':'Novo','Commander':'Encomendar','Valider et payer':'Validar e pagar','Signaler un problème':'Reportar um problema','Étape terminée':'Etapa concluída','Avis':'Avaliações','Laisser un avis':'Deixar uma avaliação','Profil du client':'Perfil do cliente'},
 ln:{'Version de test : l\'argent est fictif, rien n\'est réellement payé.':'Version ya komeka : mbongo ezali ya solo te, eloko moko te efutami na solo.','Chacun peut noter l\'autre et arrêter le contrat si l\'accord n\'est pas respecté.':'Moto nyonso akoki kopesa mosusu note mpe kokata kontra soki boyokani ebatelami te.',
  'À bloquer':'Ya kokanga','Argent bloqué':'Mbongo ekangami','À valider':'Ya kondima','Payé':'Efutami','Litige':'Ntembe','Remboursé':'Bazongisi','Livré':'Ekomi',
  'Mes projets':'Misala na ngai','Nouveau projet':'Mosala ya sika','Trouver un professionnel':'Koluka mosali','Mon compte':'Kompte na ngai','Retour':'Kozonga','Professionnels':'Basali',
  'Étapes':'Biteni','Photos':'Bafoto','Messages':'Bansango','Paiement':'Lifuti','Gardien':'Mokengeli','Espace pro':'Esika ya basali','Mes chantiers':'Bisika na ngai ya mosala',
  'Marché des matériaux':'Zando ya bisaleli','Estimer le prix d\'une maison':'Koyeba ntalo ya ndako','Mes commandes':'Bakomande na ngai','Plan de test':'Mwango ya komeka','Espace admin':'Esika ya mokambi',
  'Vérifié':'Endimami','Non vérifié':'Endimami te','Bien noté':'Note malamu','Fiable':'Ya kotyela motema','Nouveau':'Ya sika','Commander':'Kosomba','Valider et payer':'Kondima mpe kofuta','Signaler un problème':'Koyebisa likambo','Étape terminée':'Eteni esili','Avis':'Makanisi','Laisser un avis':'Kotika likanisi','Profil du client':'Profil ya kiliya'}
};
let LANG='fr'; try{LANG=localStorage.getItem('mm-lang')||'fr';}catch(e){}
const t=fr=>{if(LANG==='fr')return fr;const o=(S.tr&&S.tr[LANG])||{};return o[fr]||(I18N[LANG]||{})[fr]||fr;};
const ST=k=>t(STATUS_FR[k]||k);
const REASONS=['Travail mal fait','Travail pas fait','Retard important','Autre problème'];
const DAY=86400000;

const S={db:null,uid:null,me:undefined,pros:[],myProjects:[],proProjects:[],mode:'client',view:'home',p:{},photos:[],msgs:[],err:'',busy:false,admin:false,allProjects:[],allProfiles:[],bugs:[],products:[],productsOn:false,myOrders:[],sellerOrders:[],guardProjects:[],checkins:[],checkinsLoaded:false};
let unsubCk=null, watchedCk=null, proUnsubs=[];
let unsubProPrj=null, unsubPhotos=null, unsubMsgs=null, watchedPid=null, watchedPhotos=null;
const $main=document.getElementById('main');

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(Number(n)||0).toLocaleString('fr-FR')+' €';
const fdate=t=>t?new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'';
const ftime=t=>t?new Date(t).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const opts=(arr,sel)=>arr.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const proById=id=>S.pros.find(p=>p.id===id);
const allProjects=()=>{const m=new Map();[...S.allProjects,...S.myProjects,...S.proProjects,...S.guardProjects].forEach(p=>m.set(p.id,p));return [...m.values()];};
const prjById=id=>allProjects().find(p=>p.id===id);
const isVis=x=>!x.hidden||Date.now()-x.at>14*DAY;
const vr=r=>(r||[]).filter(isVis);
const TEST=window.TEST_MODE!==false;
const OK=x=>!!x&&!x.hidden&&(TEST||!!x.verified);
const nv=x=>x&&!x.verified?' (non vérifié)':'';
const avg=r0=>{const r=vr(r0);return r.length?(r.reduce((a,b)=>a+b.note,0)/r.length):0;};

let viewUnsubs=[];
function go(view,p){viewUnsubs.forEach(u=>u());viewUnsubs=[];S.view=view;S.p=p||{};S.err='';if(view==='req')watchReq();window.scrollTo(0,0);if(['market','estim','myfiche','home'].includes(view)&&(view!=='home'||S.mode==='pro'))ensureProducts();watchProject();render();}
function ensureProducts(){if(S.productsOn||!S.db)return;S.productsOn=true;S.db.collection('products').onSnapshot(q=>{S.products=q.docs.map(d=>Object.assign({id:d.id},d.data()));render();},()=>{});}

/* ---------- boot ---------- */
async function boot(){
  const cfg=window.FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.apiKey||cfg.apiKey.indexOf('COLLE')===0) return fail('La configuration Firebase n\'est pas encore installée.');
  try{firebase.initializeApp(cfg);}catch(e){return fail('Configuration Firebase invalide.');}
  const db=firebase.firestore();
  try{await db.enablePersistence({synchronizeTabs:true});}catch(e){}
  S.db=db; S.auth=firebase.auth();
  S.auth.onAuthStateChanged(u=>{
    S.authReady=true;
    if(!u){S.uid=null;S.me=null;render();return;}
    if(S.uid===u.uid) return;
    start(u);
  });
}
function start(u){
  const db=S.db;
  S.uid=u.uid; S.email=(u.email||'').toLowerCase(); S.me=undefined;
  S.admin=(window.ADMIN_EMAILS||[]).map(x=>String(x).toLowerCase()).includes(S.email);
  db.doc('profiles/'+S.uid).onSnapshot(s=>{
    const before=S.me&&S.me.proId;

function authCreds(){
  const em=(document.getElementById('au-email')||{}).value||'', pw=(document.getElementById('au-pass')||{}).value||'';
  const email=em.replace(/\s+/g,'').toLowerCase(); S.authEmail=email; S.err=''; S.info='';
  if(!email){S.err='Tape ton adresse email dans la case « Email ».';render();return null;}
  if(!/^[^@]+@[^@]+\.[a-z]{2,}$/.test(email)){S.err='Cette adresse email ne semble pas correcte : vérifie qu\'il y a bien un @ et un point, par exemple prenom@gmail.com.';render();return null;}
  if(pw.length<6){S.err='Le mot de passe doit faire au moins 6 caractères.';render();return null;}
  return {email,pass:pw};
}

function watchProject(){
  const pid=S.view==='project'?S.p.id:null;
  const ph=pid&&(S.p.tab==='photos'||S.p.tab==='msgs')?pid:null;
  if(ph!==watchedPhotos){
    if(unsubPhotos){unsubPhotos();unsubPhotos=null;}
    S.photos=[];S.photosLoaded=false;watchedPhotos=ph;
    if(ph) unsubPhotos=S.db.collection('photos').where('projectId','==',ph).onSnapshot(q=>{S.photos=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.at-a.at);S.photosLoaded=true;render();},()=>{});
  }
  const ck=pid&&S.p.tab==='guard'?pid:null;
  if(ck!==watchedCk){
    if(unsubCk){unsubCk();unsubCk=null;}
    S.checkins=[];S.checkinsLoaded=false;watchedCk=ck;
    if(ck) unsubCk=S.db.collection('checkins').where('projectId','==',ck).onSnapshot(q=>{S.checkins=q.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.at-a.at);S.checkinsLoaded=true;render();},()=>{});
  }
  if(pid===watchedPid) return;
  if(unsubMsgs){unsubMsgs();unsubMsgs=null;}
  S.msgs=[];watchedPid=pid;
  if(!pid) return;
  unsubMsgs=S.db.doc('messages/'+pid).onSnapshot(s=>{S.msgs=s.exists?(s.data().items||[]):[];render();},()=>{});
}

/* 7-day rule: a finished stage not answered by the client is paid automatically */
function autoRelease(){
  allProjects().forEach(p=>{
    if(!p.steps) return;
    let changed=false;
    const steps=p.steps.map(st=>{
      if(st.status==='fait'&&st.doneAt&&Date.now()-st.doneAt>7*DAY){changed=true;return Object.assign({},st,{status:'paye',paidAt:Date.now(),auto:true});}
      return st;
    });
    if(changed) S.db.doc('projects/'+p.id).update({steps}).catch(()=>{});
  });
}

function amtForm(i,cur){return `<form class="row" data-f="amt" data-v="${i}"><div class="field" style="flex:1;min-width:0"><label class="label" for="amt-${i}">Montant de l'étape (€)</label><input id="amt-${i}" inputmode="numeric" maxlength="7" value="${cur||''}" placeholder="Ex. 1000"></div><button class="btn sm" type="submit" style="align-self:flex-end">OK</button></form>`;}
function waNum(x){let d=String(x||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1);if(d.startsWith('00'))return d.slice(2);return d.length>=11?d:'';}
function waCall(p,r){
  if(r!=='client'&&r!=='pro'&&r!=='guard') return '';
  let phone='', who='';
  if(r==='client'){const pr=proById(p.proId);if(!pr)return '';phone=pr.phone;who=pr.name;}
  else{if(S.p.cphone===undefined){S.p.cphone=null;S.db.doc('profiles/'+p.clientUid).get().then(d=>{S.p.cphone=d.exists?(d.data().phone||''):'';render();}).catch(()=>{S.p.cphone='';});}phone=S.p.cphone||'';who=p.clientName;}
  const n=waNum(phone);
  const msg=r==='client'?`Bonjour, c'est ${S.me.name} (Maison Mère). Peux-tu m'appeler en vidéo pour me montrer le chantier « ${p.title} » ? Code du jour : ${dayCode(p.id)}`:`Bonjour, c'est ${myName(p)} (Maison Mère). Je peux t'appeler en vidéo pour te montrer le chantier « ${p.title} » ? Code du jour : ${dayCode(p.id)}`;
  const ico='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="12" height="10"></rect><path d="M15 11l6-3v8l-6-3"></path></svg>';
  if(!n) return `<div class="small muted" style="display:flex;gap:10px;align-items:center">${ico}<span>Appel vidéo WhatsApp : le numéro de ${esc(who)} n'a pas l'indicatif du pays (ex. +243…). Il peut le corriger dans son compte.</span></div>`;
  return `<a class="btn ghost" href="https://wa.me/${n}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" data-a="wacall" style="display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none">${ico}Appel vidéo WhatsApp</a>
    <p class="small muted" style="margin:-8px 0 0">Avec ${esc(who)}. WhatsApp s'ouvre avec un message prêt, puis appuie sur la caméra. Numéro : <span style="user-select:all">+${n}</span></p>`;
}
function pricesOk(p){return !p.pricesStatus||p.pricesStatus==='ok';}
function priceBox(p,r){
  const st=p.pricesStatus; if(!st||st==='ok') return '';
  const open=p.steps.map((x,i)=>[x,i]).filter(([x])=>x.status==='attente'&&(x.amount||S.p.counter));
  const list=open.map(([x])=>`<div class="between small"><span>${esc(x.name)}</span><span class="money">${x.amount?eur(x.amount):'à définir'}</span></div>`).join('');
  const total=open.reduce((a,[x])=>a+(+x.amount||0),0);
  const myTurn=(st==='attente_pro'&&r==='pro')||(st==='attente_client'&&r==='client');
  const other=st==='attente_pro'?p.proName:p.clientName;
  if(!myTurn) return `<div class="step" style="border-color:var(--warn)"><span class="label" style="color:var(--warn)">Prix en attente d'accord</span>
    <p class="small" style="margin:0">C'est à ${esc(other)} d'accepter ces prix${st==='attente_pro'?' depuis son espace Pro':''}. Ensuite, l'argent pourra être bloqué.</p>${list}<div class="between"><span class="t" style="font-weight:500">Total</span><span class="money">${eur(total)}</span></div></div>`;
  if(S.p.counter) return `<form class="step" data-f="counter" style="border-color:var(--fg)"><span class="label">Propose tes prix</span>
    ${open.map(([x,i])=>`<div class="row"><span class="small" style="flex:2;min-width:0">${esc(x.name)}</span><div class="field" style="flex:1;min-width:0"><label class="label" for="ct-${i}">€</label><input id="ct-${i}" inputmode="numeric" maxlength="7" value="${x.amount||''}"></div></div>`).join('')}
    <div class="row"><button class="btn sm" type="submit">Envoyer mes prix</button><button class="btn ghost sm" type="button" data-a="nocounter">Annuler</button></div></form>`;
  return `<div class="step" style="border-color:var(--fg)"><span class="label">${st==='attente_pro'?'Le client propose ces prix':'Le pro propose d\'autres prix'}</span>
    ${list}<div class="between"><span class="t" style="font-weight:500">Total</span><span class="money">${eur(total)}</span></div>
    <div class="row"><button class="btn sm" data-a="priceok">J'accepte ces prix</button><button class="btn ghost sm" data-a="counter">Proposer d'autres prix</button></div>
    ${S.err?`<p class="err" style="margin:0">${esc(S.err)}</p>`:''}<p class="small muted" style="margin:0">L'argent ne peut être bloqué que quand vous êtes d'accord tous les deux. Les autres étapes auront leur prix plus tard.</p></div>`;
}
function canBlock(p,i){return !p.stopped&&p.steps.slice(0,i).every(s=>s.status==='paye'||s.status==='rembourse');}

function choosePro(p){
  const ver=S.pros.filter(OK);
  return `<form class="stack-s" data-f="setpro" style="border:1px solid var(--fg);padding:16px">
    <span class="label">Choisis le professionnel</span>
    <p class="small muted" style="margin:0">${TEST?'Mode test : tu peux choisir n\'importe quel pro de l\'annuaire. Dans la vraie app, seuls les pros vérifiés pourront recevoir de l\'argent.':'Il faut un pro vérifié avant de bloquer l\'argent.'}</p>
    <div class="field"><label class="label" for="sp-pro">Professionnel vérifié</label><select id="sp-pro"><option value="">Choisir…</option>${ver.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.metier)} · ${esc(x.ville)}${nv(x)}</option>`).join('')}</select></div>
    ${ver.length?'<button class="btn sm" type="submit">Choisir ce pro</button>':'<p class="small muted" style="margin:0">L\'annuaire est vide pour l\'instant. Invite ton maçon à créer sa fiche dans l\'app avec le lien, ou crée une fiche de test.</p><button class="link" type="button" data-a="mkpro">Créer une fiche pro de test</button>'}
  </form>`;
}
function tSteps(p,r){
  if(!p.proId) return r==='client'?`<div class="stack">${choosePro(p)}${p.steps.map((st,i)=>`<div class="step"><div class="between"><span class="t" style="font-weight:500">${i+1}. ${esc(st.name)}</span><span class="money small">${st.amount?eur(st.amount):'Montant à définir'}</span></div></div>`).join('')}</div>`:'<div class="empty">Pas encore de professionnel sur ce projet.</div>';
  const curIdx=p.steps.findIndex(s=>s.status!=='paye'&&s.status!=='rembourse');
  const pbox=priceBox(p,r);
  const steps=pbox+p.steps.map((st,i)=>{
    let actions='', info='';
    if(st.status==='attente'){
      if(r==='client'&&canBlock(p,i)&&!pricesOk(p)) actions=st.amount?'<p class="small muted" style="margin:0">Le blocage sera possible quand vous serez d\'accord sur les prix (voir en haut).</p>':amtForm(i);
      else if(r==='client'&&canBlock(p,i)) actions=st.amount?`<button class="btn" data-a="block" data-v="${i}">Bloquer ${eur(st.amount)}</button><button class="link" data-a="editamt" data-v="${i}">Changer le montant</button>`:amtForm(i);
      if(r==='client'&&S.p.editAmt===i&&st.amount) actions=amtForm(i,st.amount);
      info=r==='pro'?'Le client n\'a pas encore bloqué l\'argent. Ne commence pas avant.':(canBlock(p,i)?'Bloque l\'argent pour que le travail commence.':'Disponible quand l\'étape précédente est payée.');
    }
    if(st.status==='bloque'){
      info=r==='pro'?`${eur(st.amount)} bloqués pour toi. Envoie tes photos puis signale la fin de l'étape.`:'Le pro travaille. L\'argent attend ta validation.';
      if(r==='pro') actions=`<button class="btn" data-a="done" data-v="${i}">Étape terminée</button>`;
      if(r==='client') actions=`<button class="btn ghost sm" data-a="dispute" data-v="${i}">Signaler un problème</button>`;
    }
    if(st.status==='fait'){
      const auto=st.doneAt+7*DAY;
      info=r==='client'?`Le pro dit que c'est fait. Vérifie les photos. Sans réponse de ta part, l'argent part automatiquement le ${fdate(auto)}.`:`En attente de la validation du client. Sans réponse, l'argent part automatiquement le ${fdate(auto)}.`;
      if(r==='client') actions=`<button class="btn" data-a="pay" data-v="${i}">Valider et payer ${eur(st.amount)}</button><button class="btn ghost" data-a="dispute" data-v="${i}">Signaler un problème</button>`;
    }
    if(st.status==='paye') info=`Payé le ${fdate(st.paidAt)}${st.auto?' (automatiquement après 7 jours)':''}${st.expert?' après décision de l\'expert':''}.`;
    if(st.status==='rembourse') info=`Remboursé au client le ${fdate(st.paidAt)}.`;
    if(st.status==='litige'){
      info=`Litige : ${esc(st.dispute.reason)}${st.dispute.text?' · « '+esc(st.dispute.text)+' »':''}. L'argent reste bloqué. Un ingénieur indépendant, tiré au sort, va vérifier sur place. Celui qui a tort paie sa visite.`;
      actions=`<span class="label">Test : simuler la décision de l'expert</span><div class="row"><button class="btn ghost sm" data-a="expert" data-v="${i}" data-d="ok">Travail conforme</button><button class="btn ghost sm" data-a="expert" data-v="${i}" data-d="redo">À refaire</button><button class="btn ghost sm" data-a="expert" data-v="${i}" data-d="refund">Rembourser</button></div>`;
    }
    if(S.p.disputeIdx===i){
      actions=`<form class="stack-s" data-f="dispute" data-v="${i}">
        <div class="field"><label class="label" for="dp-reason">Problème</label><select id="dp-reason">${opts(REASONS)}</select></div>
        <div class="field"><label class="label" for="dp-text">Explique ce qui ne va pas</label><textarea id="dp-text" rows="3" maxlength="400"></textarea></div>
        <div class="row"><button class="btn sm" type="submit">Ouvrir le litige</button><button class="btn ghost sm" type="button" data-a="nodispute">Annuler</button></div></form>`;
    }
    return `<div class="step${i===curIdx?' current':''}"><div class="between"><div class="stack-s" style="gap:2px;min-width:0"><span class="t" style="font-weight:500">${i+1}. ${esc(st.name)}</span><span class="money small">${st.amount?eur(st.amount):'Montant à définir'}</span></div><span class="pill s-${st.status}">${ST(st.status)}</span></div>
      ${info?`<p class="small muted" style="margin:0">${info}</p>`:''}${actions?`<div class="stack-s">${actions}</div>`:''}</div>`;
  }).join('');
  let review='';
  const pend=p.steps.findIndex(st=>st.status==='paye'&&((r==='client'&&!st.rvClient)||(r==='pro'&&!st.rvPro)));
  if(pend>=0) review=r==='client'?rvForm('step-c',p.id,pend,p.steps[pend].name+' · '+p.title,p.proName):rvForm('step-p',p.id,pend,p.steps[pend].name+' · '+p.title,p.clientName);
  const stop=p.stopped?'':`<button class="link" data-a="${S.p.confirmStop?'stopyes':'stop'}">${S.p.confirmStop?'Confirmer : arrêter le contrat et rembourser l\'argent bloqué non validé':'Arrêter le contrat'}</button>${S.p.confirmStop?'<button class="link" data-a="stopno">Annuler</button>':''}`;
  return `<div class="stack">${steps}${review}${stop}</div>`;
}
function reviewForm(id,title){
  const n=S.p[id+'n']||0;
  return `<form class="stack-s" data-f="${id}" style="border:1px solid var(--line);padding:16px"><span class="label">${esc(title)}</span>
    <div class="stars">${[1,2,3,4,5].map(k=>`<button type="button" aria-pressed="${k===n}" aria-label="${k} sur 5" data-a="star" data-k="${id}" data-v="${k}">${k}</button>`).join('')}</div>

function dayCode(pid,t){
  const d=new Date(t||Date.now()); const key=pid+'|'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  let h=2166136261; for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619);}
  h=h>>>0; const L='ABCDEFGHJKLMNPQRSTUVWXYZ';
  return L[h%24]+(Math.floor(h/24)%10)+'-'+String(Math.floor(h/240)%100).padStart(2,'0');
}
const KIND={avant:'Avant',pendant:'Pendant',apres:'Après'};
function phCard(ph,p){
  return `<div class="photo"><img loading="lazy" decoding="async" src="${esc(ph.data)}" alt="Photo ${esc(KIND[ph.kind]||'')} du chantier, ${esc(p.steps[ph.step]?p.steps[ph.step].name:'')}"><span><b style="font-weight:600">${esc(KIND[ph.kind]||'Photo')}</b> · ${esc(p.steps[ph.step]?p.steps[ph.step].name:'')}<br>${ftime(ph.at)} · ${ph.by==='client'?'Client · ':ph.by==='pro'?'Pro · ':''}${esc(ph.who)}${ph.code?`<br>Code attendu : <b style="font-weight:600">${esc(ph.code)}</b>`:''}${freshBadge(ph)}</span></div>`;
}
function photoReqs(p,r){
  const reqs=(p.photoReqs||[]).slice().reverse();
  const pend=reqs.filter(x=>x.status==='attente');
  let out='';
  if(r==='client') out+=`<form class="stack-s" data-f="photoreq" style="border:1px solid var(--line);padding:14px"><span class="label">Demander une photo précise</span>

    <button class="btn sm" type="submit">Envoyer la demande</button>

  if(reqs.length) out+=`<div class="stack-s"><span class="label">Photos demandées</span>${reqs.map(x=>{const ph=x.photoId?S.photos.find(y=>y.id===x.photoId):null;
    return `<div class="step${x.status==='attente'?' current':''}"><div class="between"><span class="small" style="min-width:0">« ${esc(x.text)} »</span><span class="pill ${x.status==='attente'?'s-fait':'s-paye'}">${x.status==='attente'?'À faire':'Reçue'}</span></div>
    <span class="meta">Demandée le ${ftime(x.at)}${x.doneAt?' · reçue le '+ftime(x.doneAt):''}</span>

  return out;

function tPhotos(p,r){

  const pairs=p.steps.map((st,i)=>{

    return `<div class="stack-s"><span class="label">${esc(st.name)} · avant / après</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">${cell(av,'Avant')}${cell(ap,'Après')}</div></div>`;
  }).join('');
  return `<div class="stack">
    <div style="border:1px solid var(--fg);padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px">

      <span style="font-family:var(--display);font-size:30px;letter-spacing:.04em;white-space:nowrap">${code}</span>
    </div>
    <div class="stack-s"><span class="label">Type de photo</span><div class="chips">${Object.keys(KIND).map(k=>`<button aria-pressed="${k===kind}" data-a="phkind" data-v="${k}">${KIND[k]}</button>`).join('')}</div></div>

    ${!S.photosLoaded?'<p class="small muted" style="margin:0">Chargement des photos…</p>':''}
    ${photoReqs(p,r)}

function watchReq(){
  const id=S.p.id; if(!id||!S.db) return;

  viewUnsubs.push(S.db.doc('requests/'+id).onSnapshot(d=>{S.p.req=d.exists?Object.assign({id:d.id},d.data()):false;render();},()=>{}));

function watchChat(oid){

/* ---------- mes clients (espace pro) ---------- */
function myClients(){
  const m=new Map();
  const get=(uid,name)=>{if(!uid)return null;if(!m.has(uid))m.set(uid,{uid,name:name||'Client',projects:[],orders:[],talks:0,paid:0,last:0});const c=m.get(uid);if(name&&c.name==='Client')c.name=name;return c;};
  const myId=S.me&&S.me.proId;
  [...S.proProjects,...S.guardProjects].forEach(p=>{if(p.clientUid===S.uid&&!TEST)return;const c=get(p.clientUid,p.clientName);if(!c)return;if(!c.projects.find(x=>x.id===p.id))c.projects.push(p);
    if(p.proId===myId)(p.steps||[]).forEach(st=>{if(st.status==='paye')c.paid+=(+st.amount||0);});
    (p.guardHistory||[]).forEach(h=>{if(h.proId===myId)c.paid+=(+h.amount||0);});
    c.last=Math.max(c.last,p.createdAt||0);});
  (S.sellerOrders||[]).forEach(o=>{const c=get(o.clientUid,o.clientName);if(!c)return;c.orders.push(o);if(o.status==='paye')c.paid+=(+o.total||0);c.last=Math.max(c.last,o.at||0);});
  (S.myOffers||[]).forEach(o=>{if(o.status==='acceptee')return;const r=(S.openReqs||[]).find(x=>x.id===o.requestId);const c=get(o.clientUid,r&&r.clientName);if(!c)return;c.talks++;c.last=Math.max(c.last,o.at||0);});
  return [...m.values()].sort((a,b)=>b.last-a.last);
}

/* ---------- badges ---------- */
function badges(p){
  if(!p) return [];
  const r=vr(p.reviews), st=p.stats||{}, out=[];
  out.push(p.verified?t('Vérifié'):t('Non vérifié'));
  if(r.length>=3&&avg(r)>=4.5) out.push(t('Bien noté'));
  if((st.paid||0)>=5&&!(st.lost||0)) out.push(t('Fiable')+' · '+st.paid+' étapes');
  else if((st.paid||0)>0) out.push(st.paid+' étape'+(st.paid>1?'s':'')+' payée'+(st.paid>1?'s':''));
  if(!r.length&&!(st.paid||0)) out.push(t('Nouveau'));
  return out;
}
function avatar(photo,name,sz){sz=sz||40;const ini=String(name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();return photo?`<img class="av" src="${photo}" alt="" width="${sz}" height="${sz}" style="width:${sz}px;height:${sz}px">`:`<span class="av" aria-hidden="true" style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px">${esc(ini)}</span>`;}

function uPhoto(uid){if(!uid)return '';if(uid===S.uid)return S.me&&S.me.photo||'';if(S.ph[uid]===undefined){S.ph[uid]='';S.db.doc('profiles/'+uid).get().then(d=>{const x=d.exists&&d.data().photo;if(x){S.ph[uid]=x;render();}}).catch(()=>{});}return S.ph[uid];}

function avatarData(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const n=Math.min(img.naturalWidth,img.naturalHeight),c=document.createElement('canvas');c.width=c.height=240;c.getContext('2d').drawImage(img,(img.naturalWidth-n)/2,(img.naturalHeight-n)/2,n,n,0,0,240,240);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.8));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}

function vEstim(){
  const size=S.p.size||'3 chambres', m2=EST_SIZE[size];

/* ---------- gardien ---------- */
function guardStats(g){
  const days=Math.min(30,Math.max(1,Math.ceil((Date.now()-g.startAt)/DAY)));
  const keys=new Set(S.checkins.filter(c=>c.at>=g.startAt).map(c=>new Date(c.at).toDateString()+c.slot));
  const present=Math.min(keys.size,days*2);
  return {days,expected:days*2,present,amount:Math.round(g.salary*present/(days*2))};
}
function guardHist(p,r){

    ${r==='client'&&!x.rvClient?rvForm('g-c',p.id,i,'Gardiennage · '+p.title,x.proName):''}${r==='guard'&&!x.rvGuard&&S.me.proId===x.proId?rvForm('g-g',p.id,i,'Gardiennage · '+p.title,p.clientName):''}`).join('')}</div>`;

function tGuard(p,r){
  const g=p.guard;
  if(!g){
    if(r!=='client') return `<div class="stack"><div class="empty">Pas de gardien en ce moment sur ce chantier.</div>${guardHist(p,r)}</div>`;
    const guards=S.pros.filter(OK).sort((a,b)=>(b.metier==='Gardiennage')-(a.metier==='Gardiennage'));
    return `<form class="stack" data-f="hire">

      ${guards.length?'':'<span class="small muted">L\'annuaire est vide. Pour tester seul, crée une fiche pro (métier « Gardiennage » de préférence).</span>'}</div>
      <div class="field"><label class="label" for="gd-sal">Salaire du mois (€)</label><input id="gd-sal" inputmode="numeric" maxlength="5" required></div>
      ${S.err?`<p class="err">${esc(S.err)}</p>`:''}
      <button class="btn" type="submit">Engager et bloquer le salaire</button></form>${guardHist(p,r)}`;
  }
  const stt=guardStats(g);
  const today=new Date().toDateString();
  const did=sl=>S.checkins.some(c=>c.slot===sl&&new Date(c.at).toDateString()===today);
  const last7=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*DAY);const ds=d.toDateString();
    const on=sl=>S.checkins.some(c=>c.slot===sl&&new Date(c.at).toDateString()===ds);
    return `<div><span>${d.toLocaleDateString('fr-FR',{weekday:'narrow'})}</span><span class="dot${on('matin')?' on':''}" title="Matin"></span><span class="dot${on('soir')?' on':''}" title="Soir"></span></div>`;}).join('');
  return `<div class="stack">
    <div class="between"><div><div class="t" style="font-weight:500">${esc(g.proName)}</div><div class="small muted">Depuis le ${fdate(g.startAt)} · ${eur(g.salary)} / mois bloqués</div></div>${badgesHtml(proById(g.proId))}</div>
    ${!S.checkinsLoaded?'<p class="small muted">Chargement des pointages…</p>':''}
    <div class="stack-s"><span class="label">7 derniers jours · matin et soir</span><div class="days">${last7}</div></div>
    <p class="small" style="margin:0">${stt.present} pointages sur ${stt.expected} attendus → <span class="money">${eur(stt.amount)}</span> à verser.</p>
    ${r==='guard'?`<div class="row">
      <label class="btn${did('matin')?' ghost':''}" style="display:flex;align-items:center;justify-content:center;flex:1" for="ck-matin">${did('matin')?'Matin pointé':'Pointer le matin'}</label><input id="ck-matin" class="ck-file" data-slot="matin" type="file" accept="image/*" capture="environment" hidden>

function houseCard(p){
  const n=p.steps.length||1, paid=p.steps.filter(s=>s.status==='paye').length;
  const lvl=paid===0?0:Math.min(4,Math.max(1,Math.round(paid/n*4)));
  const msgs=['Le terrain attend sa première pierre.','Les fondations sont posées !','Les murs montent !','Les murs sont debout !','Ta maison est terminée !'];
  const L='style="fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"';
  const F=c=>`style="fill:var(${c});stroke:var(--fg);stroke-width:1.6;stroke-linejoin:round"`;
  let g=`<path d="M4 86H116" ${L}/>`;
  if(lvl===0) g+=`<path d="M30 86V70 M30 70L44 75L30 80" ${L}/><path d="M60 86l6-5 6 5 M84 86l5-4 5 4" ${L}/>`;
  if(lvl>=1) g+=`<rect x="24" y="78" width="72" height="8" ${F('--tile')}/>`;
  if(lvl===2) g+=`<rect x="28" y="62" width="64" height="16" ${F('--tile')}/><path d="M28 70H92 M44 62V70 M60 70V78 M76 62V70" ${L}/>`;
  if(lvl>=3) g+=`<rect x="28" y="46" width="64" height="32" ${F('--tile')}/><rect x="36" y="54" width="12" height="10" ${F('--bg')}/><rect x="72" y="54" width="12" height="10" ${F('--bg')}/>`;
  if(lvl===4) g+=`<path d="M20 48L60 20L100 48Z" ${F('--warn')}/><rect x="54" y="62" width="12" height="16" ${F('--bg')}/><circle cx="104" cy="16" r="6" ${F('--warn')}/>`;
  return `<div class="house"><svg viewBox="0 0 120 96" role="img" aria-label="Avancement de la maison : ${paid} étape(s) sur ${n} payée(s)">${g}</svg>
    <div class="stack-s" style="min-width:0"><span class="msg">${msgs[lvl]}</span><span class="small muted">${paid} étape${paid>1?'s':''} sur ${n} payée${paid>1?'s':''}</span></div></div>`;
}

/* date de prise de vue cachée dans la photo (EXIF) */
function exifDate(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{try{
      const v=new DataView(fr.result); if(v.getUint16(0)!==0xFFD8) return res(null);
      let o=2;
      while(o<v.byteLength-4){
        const mk=v.getUint16(o), len=v.getUint16(o+2);
        if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
          const t=o+10, le=v.getUint16(t)===0x4949, g16=x=>v.getUint16(x,le), g32=x=>v.getUint32(x,le);
          const str=(off,n)=>{let r='';for(let i=0;i<n-1;i++)r+=String.fromCharCode(v.getUint8(t+off+i));return r;};
          let best=null;
          const ifd=(off,depth)=>{if(depth>2||off<=0||t+off+2>v.byteLength)return;const n=g16(t+off);for(let i=0;i<n;i++){const e=t+off+2+i*12;if(e+12>v.byteLength)break;const tag=g16(e);
            if(tag===0x9003||(tag===0x0132&&!best)){best=str(g32(e+8),20);}
            if(tag===0x8769)ifd(g32(e+8),depth+1);}};
          ifd(g32(t+4),0);
          if(!best) return res(null);
          const m=best.match(/(\d{4}):(\d{2}):(\d{2}) (\d{2}):(\d{2}):(\d{2})/); if(!m) return res(null);
          return res(new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime());
        }
        if((mk&0xFF00)!==0xFF00) break; o+=2+len;
      }
      res(null);
    }catch(e){res(null);}};
    fr.onerror=()=>res(null);
    fr.readAsArrayBuffer(file.slice(0,262144));
  });
}
function freshness(shot,at){
  if(!shot) return {k:'unk',t:'Date de prise inconnue'};
  const d=Math.abs((at||Date.now())-shot);
  if(d<=6*3600000) return {k:'ok',t:'Prise aujourd\'hui'};
  return {k:'old',t:'Photo ancienne : prise le '+new Date(shot).toLocaleDateString('fr-FR')};
}
function freshBadge(ph){
  if(ph.src==='camera') return '<br><b style="font-weight:600;color:var(--ok)">✓ Prise en direct dans l\'app</b>';
  if(!('shotAt' in ph)) return '';
  const f=freshness(ph.shotAt,ph.at);
  const col=f.k==='ok'?'var(--ok)':f.k==='old'?'var(--bad)':'var(--warn)';
  return `<br><b style="font-weight:600;color:${col}">${f.k==='ok'?'✓':'⚠'} ${esc(f.t)}</b>`;
}
function shrink(file,m0,target,stamp){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight; const m=m0||720; if(Math.max(w,h)>m){const k=m/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,0,0,w,h);
      if(stamp){
        const code=stamp.split(' · ')[0], rest=stamp.split(' · ').slice(1).join(' · ');
        const big=Math.max(28,Math.round(Math.min(w,h)/7)), pad=Math.round(big*.35);
        g.font='700 '+big+'px system-ui,sans-serif'; g.textBaseline='middle';
        const tw=g.measureText(code).width, bw=tw+pad*2, bh2=big+pad*1.6, x0=Math.round(w*.04), y0=Math.round(w*.04);
        g.fillStyle='#FFD400'; g.fillRect(x0,y0,bw,bh2); g.strokeStyle='#111'; g.lineWidth=Math.max(2,Math.round(big/14)); g.strokeRect(x0,y0,bw,bh2);
        g.fillStyle='#111'; g.fillText(code,x0+pad,y0+bh2/2+1);
        const fs=Math.max(13,Math.round(w/30)),bh=Math.round(fs*2);g.fillStyle='rgba(0,0,0,.62)';g.fillRect(0,h-bh,w,bh);g.fillStyle='#fff';g.font='600 '+fs+'px system-ui,sans-serif';g.fillText(rest,Math.round(fs*.6),h-bh/2);
      }
      URL.revokeObjectURL(url);
      let q=.6,d=c.toDataURL('image/jpeg',q); while(d.length>(target||80000)&&q>.25){q-=.1;d=c.toDataURL('image/jpeg',q);}
      d.length>140000?rej(new Error('big')):res(d);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}

document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target.dataset.f; S.err='';
  if(f==='login'){if(S.busyAuth)return;const cr=authCreds();if(!cr)return;S.info='Connexion en cours…';S.busyAuth=true;render();try{await S.auth.signInWithEmailAndPassword(cr.email,cr.pass);}catch(er){S.info='';S.err=(AUTH_ERR[er.code]||'Connexion impossible.')+' ['+(er.code||'erreur')+' · '+new Date().toLocaleTimeString('fr-FR')+']';}S.busyAuth=false;render();return;}
  const p=S.view==='project'?prjById(S.p.id):null;
  try{
    if(f==='signup'){
      if(!val('su-name')||!val('su-phone')||!val('su-ville')){S.err='Remplis tous les champs.';return render();}
      const role=S.p.role==='pro'?'pro':'client';
      await S.db.doc('profiles/'+S.uid).set({name:val('su-name'),phone:val('su-phone'),pays:val('su-pays'),ville:val('su-ville'),role,createdAt:Date.now(),proId:null,reviews:[]});
      S.mode=role;S.chosen=true;try{localStorage.setItem('mm-mode-'+S.uid,role);sessionStorage.setItem('mm-chosen-'+S.uid,'1');}catch(e){}
      if(role==='pro') return go('myfiche');
    }
    if(f==='account'){await S.db.doc('profiles/'+S.uid).update({name:val('ac-name'),phone:val('ac-phone'),ville:val('ac-ville')});go('home');}
    if(f==='newp'){
      const proId=val('np-pro'), pro=proById(proId);
      const steps=[0,1,2,3].map(i=>({name:val('np-s'+i),amount:parseInt(val('np-a'+i).replace(/\D/g,''),10)||0})).filter(s=>s.name)
        .map(s=>({name:s.name,amount:s.amount,status:'attente',blockedAt:null,doneAt:null,paidAt:null}));
      if(!val('np-title')||!val('np-ville')){S.err='Donne un nom et une ville au projet.';return render();}
      if(proId&&!OK(pro)){S.err='Ce professionnel n\'est pas vérifié.';return render();}
      if(!steps.length){S.err='Ajoute au moins une étape, par exemple « Fondations ».';return render();}
      const ref=await S.db.collection('projects').add({title:val('np-title'),pays:val('np-pays'),ville:val('np-ville'),clientUid:S.uid,clientName:S.me.name,proId:proId||null,proName:pro?pro.name:'',createdAt:Date.now(),steps,pricesStatus:proId?'attente_pro':'ok',reviewed:false,proReviewed:false,stopped:null});
      go('project',{id:ref.id,tab:'steps'});
    }
    if(f==='fiche'){
      const data={photo:S.me.photo||'',name:val('pf-name'),metier:val('pf-metier'),pays:val('pf-pays'),ville:val('pf-ville'),phone:val('pf-phone'),rccm:val('pf-rccm'),about:val('pf-about')};
      if(!data.name||!data.ville||!data.phone){S.err='Remplis le nom, la ville et le téléphone.';return render();}
      if(S.me.proId){await S.db.doc('pros/'+S.me.proId).update(data);}
      else{const ref=await S.db.collection('pros').add(Object.assign(data,{ownerUid:S.uid,verified:false,example:false,reviews:[],createdAt:Date.now()}));await S.db.doc('profiles/'+S.uid).update({proId:ref.id});}
      S.mode='pro';go('home');
    }
    if(f==='dispute'&&p){
      const i=+e.target.dataset.v;
      await setSteps(p,i,{status:'litige',dispute:{reason:val('dp-reason'),text:val('dp-text'),at:Date.now()}});
      await sysMsg(p.id,`${p.steps[i].name} : litige ouvert par le client (${val('dp-reason')}). L'argent reste bloqué, un expert va vérifier.`);
      S.p.disputeIdx=null;render();
    }
    if(f==='order'){
      const x=S.products.find(y=>y.id===e.target.dataset.v); if(!x) return;
      const qty=Math.max(1,parseInt(val('or-qty'),10)||1);
      if(!val('or-addr')){S.err='Indique l\'adresse de livraison.';return render();}
      await S.db.collection('orders').add({productId:x.id,productName:x.name,unit:x.unit,price:x.price,qty,total:Math.round(qty*x.price*100)/100,sellerProId:x.sellerProId,sellerName:x.sellerName,clientUid:S.uid,clientName:S.me.name,addr:val('or-addr'),status:'bloque',at:Date.now()});
      return go('orders');
    }
    if(f==='prod'){
      const me=proById(S.me.proId); const price=parseFloat(val('pr-price').replace(',','.'));
      if(!me||!val('pr-name')||!(price>0)){S.err='Donne un nom et un prix.';return render();}
      await S.db.collection('products').add({sellerProId:me.id,sellerName:me.name,name:val('pr-name'),cat:val('pr-cat'),unit:val('pr-unit')||'pièce',price,pays:me.pays,ville:me.ville,at:Date.now()});
      ['pr-name','pr-price'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
    }
    if(f==='hire'&&p){
      const g=proById(val('gd-pro')), sal=parseInt(val('gd-sal').replace(/\D/g,''),10)||0;
      if(!g||!sal){S.err='Choisis un gardien et un salaire.';return render();}
      await S.db.doc('projects/'+p.id).update({guard:{proId:g.id,proName:g.name,salary:sal,startAt:Date.now()},guardProId:g.id});
      await sysMsg(p.id,`Gardien ${g.name} engagé : ${eur(sal)} bloqués pour le mois.`);
    }
    if(f==='tr'&&S.admin){
      const ln={}; e.target.querySelectorAll('input[data-k]').forEach(el=>{if(el.value.trim()) ln[el.dataset.k]=el.value.trim();});
      await S.db.doc('config/i18n').set(Object.assign({},S.tr||{},{ln}));S.p.trSaved=true;render();
    }
    if(f==='review'){
      const key=e.target.dataset.key, n=S.p['rv_'+key+'n']; if(!n) return;
      const kind=e.target.dataset.kind, v=e.target.dataset.v, x=e.target.dataset.x, text=val('rvt-'+key);
      let tx='',other=false,mine='';
      if(kind==='step-c'||kind==='step-p'){const pr=prjById(v),st=pr.steps[+x];tx='step:'+v+':'+x;other=kind==='step-c'?!!st.rvPro:!!st.rvClient;mine=kind==='step-c'?'profiles/'+pr.clientUid:'pros/'+pr.proId;}
      if(kind==='ord-c'||kind==='ord-s'){const o=[...S.myOrders,...S.sellerOrders].find(y=>y.id===v);tx='ord:'+v;other=kind==='ord-c'?!!o.rvSeller:!!o.rvClient;mine=kind==='ord-c'?'profiles/'+o.clientUid:'pros/'+o.sellerProId;}
      if(kind==='g-c'||kind==='g-g'){const pr=prjById(v),h=pr.guardHistory[+x];tx='g:'+v+':'+x;other=kind==='g-c'?!!h.rvGuard:!!h.rvClient;mine=kind==='g-c'?'profiles/'+pr.clientUid:'pros/'+h.proId;}
      if(other){const ref=S.db.doc(mine);const d=await ref.get();if(d.exists){await ref.update({reviews:(d.data().reviews||[]).map(y=>y.tx===tx?Object.assign({},y,{hidden:false}):y)});}}
      const add=async(path,about)=>{const ref=S.db.doc(path);const d=await ref.get();if(!d.exists)return;await ref.update({reviews:[...(d.data().reviews||[]),{tx,hidden:!other,uid:S.uid,name:kind==='step-p'?(prjById(v)||{}).proName:kind==='ord-s'?((S.sellerOrders.find(o=>o.id===v)||{}).sellerName):kind==='g-g'?((proById(S.me.proId)||{}).name):S.me.name,note:n,text,about,at:Date.now()}]});};
      if(kind==='step-c'||kind==='step-p'){const pr=prjById(v);const i=+x;const st=pr.steps[i];
        await add(kind==='step-c'?'pros/'+pr.proId:'profiles/'+pr.clientUid,st.name+' · '+pr.title);
        await setSteps(pr,i,kind==='step-c'?{rvClient:true}:{rvPro:true});}
      if(kind==='ord-c'||kind==='ord-s'){const o=[...S.myOrders,...S.sellerOrders].find(y=>y.id===v);
        await add(kind==='ord-c'?'pros/'+o.sellerProId:'profiles/'+o.clientUid,'Commande : '+o.qty+' × '+o.productName);
        await S.db.doc('orders/'+v).update(kind==='ord-c'?{rvClient:true}:{rvSeller:true});}
      if(kind==='g-c'||kind==='g-g'){const pr=prjById(v);const i=+x;const h=pr.guardHistory[i];
        await add(kind==='g-c'?'pros/'+h.proId:'profiles/'+pr.clientUid,'Gardiennage · '+pr.title);
        const hist=pr.guardHistory.map((y,k)=>k===i?Object.assign({},y,kind==='g-c'?{rvClient:true}:{rvGuard:true}):y);
        await S.db.doc('projects/'+pr.id).update({guardHistory:hist});}
      delete S.p['rv_'+key+'n'];render();
    }
    if(f==='amt'&&p){
      const i=+e.target.dataset.v, n=parseInt(val('amt-'+i).replace(/\D/g,''),10)||0;
      if(!n){S.err='Indique un montant.';return render();}
      const steps=p.steps.map((x,k)=>k===i?Object.assign({},x,{amount:n}):x);
      await S.db.doc('projects/'+p.id).update({steps,pricesStatus:p.proId?'attente_pro':'ok'});
      if(p.proId) await sysMsg(p.id,`${S.me.name} propose ${eur(n)} pour l'étape « ${p.steps[i].name} ». En attente de l'accord du pro.`);
      S.p.editAmt=null;render();
    }
    if(f==='counter'&&p){
      const r0=role(p);
      const steps=p.steps.map((x,i)=>{if(x.status!=='attente')return x;const el=document.getElementById('ct-'+i);const n=el?parseInt(el.value.replace(/\D/g,''),10)||0:x.amount;return Object.assign({},x,{amount:n});});
      await S.db.doc('projects/'+p.id).update({steps,pricesStatus:r0==='pro'?'attente_client':'attente_pro'});
      await sysMsg(p.id,`${r0==='pro'?p.proName:S.me.name} propose d'autres prix : ${steps.filter(x=>x.status==='attente').map(x=>x.name+' '+eur(x.amount)).join(', ')}.`);
      S.p.counter=false;render();
    }
    if(f==='photoreq'&&p){
      const text=val('pq-text'); if(!text) return;
      const list=[...(p.photoReqs||[]),{id:Math.random().toString(36).slice(2,9),text,at:Date.now(),status:'attente',photoId:null}];
      await S.db.doc('projects/'+p.id).update({photoReqs:list});
      await sysMsg(p.id,`${S.me.name} demande une photo : « ${text} ».`);
    }
    if(f==='setpro'&&p){
      const pr=proById(val('sp-pro')); if(!OK(pr)){S.err='Choisis un pro dans la liste.';return render();}
      await S.db.doc('projects/'+p.id).update({proId:pr.id,proName:pr.name,pricesStatus:'attente_pro'});
      await sysMsg(p.id,`${pr.name} est choisi comme professionnel du projet.`);
    }
    if(f==='reqnew'){
      if(!val('rq-title')||!val('rq-ville')){S.err='Décris ton besoin et indique la ville.';return render();}
      const ref=await S.db.collection('requests').add({clientUid:S.uid,clientName:S.me.name,title:val('rq-title'),metier:val('rq-metier'),pays:val('rq-pays'),ville:val('rq-ville'),desc:val('rq-desc'),budget:parseInt(val('rq-budget').replace(/\D/g,''),10)||0,status:'ouverte',offerCount:0,at:Date.now()});
      S.back={view:'home',p:{}};return go('req',{id:ref.id});
    }
    if(f==='offer'){
      const me=proById(S.me.proId),x=S.p.req; if(!me||!x) return;
      const price=parseInt(val('of-price').replace(/\D/g,''),10)||0;
      if(!price){S.err='Indique ton prix total.';return render();}
      let steps=[0,1,2].map(i=>({name:val('of-s'+i),amount:parseInt(val('of-a'+i).replace(/\D/g,''),10)||0})).filter(st=>st.name&&st.amount);
      if(steps.length&&steps.reduce((a,b)=>a+b.amount,0)!==price){S.err='La somme des étapes doit être égale au prix total ('+eur(price)+').';return render();}
      await S.db.collection('offers').add({requestId:x.id,clientUid:x.clientUid,proId:me.id,proName:me.name,proUid:S.uid,price,delay:val('of-delay'),note:val('of-note'),steps,status:'envoyee',at:Date.now()});
      await S.db.doc('requests/'+x.id).update({offerCount:(x.offerCount||0)+1});
      render();
    }
    if(f==='ochat'){
      const oid=e.target.dataset.v, text=val('oc-text'); if(!text) return;
      const ref=S.db.doc('offerchats/'+oid); const d=await ref.get();
      const items=(d.exists?(d.data().items||[]):[]).slice(-300);
      const o=(S.p.offers||[]).find(y=>y.id===oid);
      items.push({uid:S.uid,who:o&&o.proUid===S.uid?o.proName:S.me.name,text,at:Date.now()});
      await ref.set({items}); const el=document.getElementById('oc-text'); if(el) el.value='';
    }
    if(f==='bug'){
      const text=val('bug-text'); if(!text) return;
      await S.db.collection('bugs').add({text,who:S.me.name,uid:S.uid,at:Date.now()});
      document.getElementById('bug-text').value='';S.p.bugSent=true;render();
    }
    if(f==='addpro'&&S.admin){
      const d={name:val('ap-name'),metier:val('ap-metier'),pays:val('ap-pays'),ville:val('ap-ville'),phone:val('ap-phone')};
      if(!d.name||!d.ville){S.err='Donne au moins un nom et une ville.';return render();}
      await S.db.collection('pros').add(Object.assign(d,{rccm:'',about:'',ownerUid:null,verified:false,example:false,addedByAdmin:true,reviews:[],createdAt:Date.now()}));
      ['ap-name','ap-ville','ap-phone'].forEach(id=>{const el=document.getElementById(id);if(el) el.value='';});
    }
    if(f==='msg'&&p){
      const text=val('msg-text'); if(!text) return;
      const ref=S.db.doc('messages/'+p.id); const s=await ref.get();
      const items=(s.exists?(s.data().items||[]):[]).slice(-300);
      items.push({uid:S.uid,who:myName(p),text,at:Date.now()});
      await ref.set({items});
      document.getElementById('msg-text').value='';
    }
    if((f==='rv'||f==='rc')&&p){
      const n=S.p[f+'n']; if(!n) return;
      const text=val(f+'-text');
      if(f==='rv'){const pro=proById(p.proId);if(pro){await S.db.doc('pros/'+pro.id).update({reviews:[...(pro.reviews||[]),{uid:S.uid,name:S.me.name,note:n,text,at:Date.now()}]});}await S.db.doc('projects/'+p.id).update({reviewed:true});}
      if(f==='rc'){const ref=S.db.doc('profiles/'+p.clientUid);const s=await ref.get();if(s.exists){await ref.update({reviews:[...(s.data().reviews||[]),{uid:S.uid,name:p.proName,note:n,text,at:Date.now()}]});}await S.db.doc('projects/'+p.id).update({proReviewed:true});}
    }
  }catch(err){S.err=err&&err.code==='quota_exceeded'?'La base de test est pleine.':'Enregistrement impossible pour le moment. Réessaie.';render();}
});

boot();
})();
